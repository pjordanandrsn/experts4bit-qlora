[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "experts4bit-qlora"
version = "0.18.0"
description = "QLoRA fine-tuning of fused 4-bit Mixture-of-Experts on a single small GPU, on stock bitsandbytes."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jordan Anderson", email = "paul.jordan.anderson@gmail.com" }]
keywords = ["bitsandbytes", "qlora", "moe", "mixture-of-experts", "quantization", "nf4", "lora", "olmoe"]
dependencies = [
    "torch>=2.2",
    "bitsandbytes>=0.43",
]

# The Experts4bit primitive, ExpertsLoRA adapters, and the benchmarks need only torch + bitsandbytes.
# The end-to-end OLMoE streaming trainer additionally needs transformers>=5.0 (fused expert layout).
[project.optional-dependencies]
# The fused single-launch grouped GEMM (dequant-inside-the-GEMM, fp32 accum) —
# enables experts4bit_qlora.enable_fast() for inference. Import stays optional.
fast = [
    # >=0.11.0. History, because the floor has been understated twice: 0.9.0 is
    # where `segment_into` / `segment_geometry` landed, which
    # `enable_nvme_train_residency` imports; 0.10.0 is where
    # `capacity_for_bytes` stopped over-promising rows for pinned tiers, and
    # both docstrings tell callers to size `hot_rows` from that helper, so on
    # <0.10.0 the advice hands back roughly twice the rows that fit.
    #
    # 0.11.0 was the floor for two reasons. `nvme_train` imports
    # `widening_casts` to accept a bf16-absmax arena -- defensively, so an older
    # gnf4 still works, but the capability is simply absent there and its tests
    # skip. And `qd` now defers to gnf4's CPU-scaled default, which does not
    # exist below 0.11.0; the key is omitted rather than forwarded so an older
    # build still gets its own default instead of 32 reader threads.
    #
    # 0.12.0 is the floor now, and unlike the two above this one is HARD rather
    # than advisory. Below it, `nvme_residency._ST_TO_TORCH` has no entry for
    # `F8_E8M0` -- the tag DeepSeek-V4 uses for its MXFP4 expert scales -- so
    # `check_arena_geometry` raises `KeyError: 'F8_E8M0'` and a real V4 arena
    # cannot be staged for training AT ALL. There is no degraded mode to fall
    # back to and nothing skips: it is the difference between the MXFP4 arena
    # training path working and not existing. Measured on a rented 3090 after a
    # 149 GB download and a 147 GB bake (bench/mxfp4-arena-train/), and fixed in
    # grouped-nf4-gemm#75, first released in 0.12.0.
    "grouped-nf4-gemm>=0.12.0",
]
train = [
    "transformers>=5.0",
    "datasets>=2.14",
    "accelerate>=0.30",
    "safetensors>=0.4",
    "huggingface_hub>=0.23",
]
# The HTTP serving shim (experts4bit_qlora.serve) — loader deps included so it installs without [train].
serve = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2",
    "transformers>=5.0",
    "accelerate>=0.30",
    "safetensors>=0.4",
    "huggingface_hub>=0.23",
]
# `grouped-nf4-gemm` is here and NOT only in [fast] because the suite cannot check
# the arena paths without it. `tests/test_nvme_train_residency.py` and
# `tests/test_nvme_residency_equivalence.py` both `importorskip("nvme_arena")`, so
# on a runner that installed only `.[test]` they SKIPPED — 29 + 13 tests reported
# as coverage that never executed. The arena-backed training path merged with its
# entire gate having run on one laptop.
#
# Pinned >= 0.9.0, not [fast]'s >= 0.2.4: that is the release carrying
# `nvme_residency.segment_into`, which the training path stages every layer
# through. An older gnf4 satisfies [fast] and still skips these tests.
# gnf4 >=0.12.0 here too, and for a reason beyond matching `fast`: below it
# `test_mxfp4_arena_train.py::test_a_real_v4_arena_labels_its_scales_f8_e8m0`
# XFAILS (its marker is conditional on the installed gnf4). Green either way,
# so a stale floor would leave CI permanently NOT exercising the V4-label path
# while looking covered -- the failure mode this repo keeps relearning.
test = ["pytest>=7", "transformers>=5.0", "accelerate>=0.30", "safetensors>=0.4", "fastapi>=0.110", "httpx>=0.27", "grouped-nf4-gemm>=0.12.0"]

[project.urls]
Homepage = "https://github.com/pjordanandrsn/experts4bit-qlora"
"Upstream (bitsandbytes#1965)" = "https://github.com/bitsandbytes-foundation/bitsandbytes/pull/1965"
"Tracking (bitsandbytes#1849)" = "https://github.com/bitsandbytes-foundation/bitsandbytes/issues/1849"

[tool.setuptools.packages.find]
include = ["experts4bit_qlora*"]

[tool.ruff]
line-length = 119

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
experts4bit_qlora = ["py.typed", "README-LAYOUT.md"]
