name: Release

# Publishes to PyPI via Trusted Publishing (OIDC) — no API token/secret.
# Requires a PyPI trusted publisher for project `experts4bit-qlora` configured with:
#   owner: pjordanandrsn | repo: experts4bit-qlora | workflow: release.yml
# Triggered by publishing a GitHub release for a version tag (gh release create vX.Y.Z), so every PyPI version has a
# GitHub release with the same notes. Pushing a tag alone publishes nothing.

on:
  release:
    types: [published]

jobs:
  pypi-publish:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write # mint the OIDC token PyPI trusts
      actions: read   # read CI's runs at the tag's commit (the step before publishing)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: built-artifact smoke (blocks publish)
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet dist/*.whl \
            torch --extra-index-url https://download.pytorch.org/whl/cpu
          cp scripts/wheel_smoke.py /tmp/
          cd /tmp && ./venv/bin/python wheel_smoke.py
      - name: README link check (real tag URLs)
        run: python scripts/check_readme_links.py
      - name: CI is green at the tag's commit (refuse to publish otherwise)
        # CI collapses pending runs on main, so the tagged commit may have no run of its own. The release guide
        # says to dispatch CI at the tag first (gh workflow run CI --ref vX.Y.Z); this step makes it a gate: no
        # successful push or dispatch ci.yml run on exactly this commit, no PyPI upload.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # push and workflow_dispatch runs test this exact commit; a pull_request run whose head is this sha tested
          # refs/pull/N/merge instead, so it does not count.
          n=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=success&per_page=100" \
                --jq '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")] | length')
          if [ "${n:-0}" -lt 1 ]; then
            echo "::error::no successful CI run at ${GITHUB_SHA}. Run CI at the tag (gh workflow run CI --ref ${GITHUB_REF_NAME}), wait for green, then re-run this job."
            exit 1
          fi
          echo "CI green at ${GITHUB_SHA} (${n} successful run(s))"
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
