name: Release

# Publishes to PyPI via Trusted Publishing (OIDC) — no API token/secret.
# Requires a PyPI trusted publisher for project `experts4bit-qlora` configured with:
#   owner: pjordanandrsn | repo: experts4bit-qlora | workflow: release.yml
# Triggered by publishing a GitHub release for a version tag (gh release create vX.Y.Z), so every PyPI version has a
# GitHub release with the same notes. Pushing a tag alone publishes nothing.

on:
  release:
    types: [published]

jobs:
  pypi-publish:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write # mint the OIDC token PyPI trusts
      actions: read   # read CI's runs at the tag's commit (the first step after checkout)
    steps:
      - uses: actions/checkout@v4
      - name: CI is green at the tag's commit (refuse to publish otherwise)
        # First after checkout: the job holds id-token: write throughout, so nothing else (setup, the build, the
        # smoke's pip installs) runs on a commit this step would refuse. The commit is read from the checkout above,
        # which is the release's tag. Only push and workflow_dispatch
        # runs of ci.yml count: a pull_request run whose head is this commit tested refs/pull/N/merge. The release
        # script waits for that commit's CI to go green before publishing; this step is the backstop. The count is
        # checked as an integer: a non-integer used to make the old `-lt 1` test error inside its if, which passed.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          n=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&status=success&per_page=100" \
                --jq '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")] | length') \
            || { echo "::error::could not read ci.yml's runs at ${SHA}; refusing to publish"; exit 1; }
          [ "${n:-0}" -ge 1 ] 2>/dev/null || {
            echo "::error::no successful CI run at the tagged commit ${SHA} (read: '${n}'). If a CI run at ${SHA} is still running, wait for it to go green and re-run this job; otherwise dispatch CI at the tag (gh workflow run CI --ref <tag>), then re-run this job."
            exit 1
          }
          echo "CI green at ${SHA} (${n} successful run(s))"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: built-artifact smoke (blocks publish)
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet dist/*.whl \
            torch --extra-index-url https://download.pytorch.org/whl/cpu
          cp scripts/wheel_smoke.py /tmp/
          cd /tmp && ./venv/bin/python wheel_smoke.py
      - name: README link check (real tag URLs)
        run: python scripts/check_readme_links.py
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
