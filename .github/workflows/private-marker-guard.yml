name: private-marker-guard
on: [push, pull_request]

# Refuses private-lane material in the public tree.
#
# WIDENED 2026-07-28 after an audit found material this guard was structurally
# unable to see. The old rules were `^AGENT-` (repo root only) and a literal
# "(PRIVATE)" grep with a hardcoded per-file exemption. Everything below was
# public and slipped past both:
#
#   * a competitive dossier on a NAMED third-party OSS contributor, whose own
#     text read "(for the record; do NOT post)"
#   * an ops log scripting a "Two-Comment Coordination Operation" against an
#     upstream project, with "radio silence" / "aftermath rails armed"
#   * docs/WATCHLIST.md ("UNCOMMITTED, private-fork only until reviewed") and
#     docs/COMPETITIVE.md ("Moves to the public repo at the gate")
#   * private-fork branch refs, ~/e4b-outbox and ~/e4b-evidence paths, RunPod
#     pod ids, and the author's NAS/UPS model with a note on which service was
#     not listening
#
# Patterns live in .github/private-markers.txt, one extended-regex per line,
# each annotated with the incident it would have caught.
#
# ALLOWLIST: put `guard-allow` on the same line to exempt a deliberate mention.
# Prefer rewording over allowlisting. There is exactly ONE hardcoded file
# exemption, and it cannot be reworded: bench/dq11/DQ11-AMENDMENT-4.md, a sealed
# registration (its bytes are pinned in science.sha256) committed before the
# guard learned adertha:// URIs. Nothing else may be added the same way.
#
# FIXTURES that must carry a receipt-store shape (test inputs for code that
# parses the store's ledger) are exempt only through an "#exempt-fixture:" line
# in .github/private-markers.txt: a line cap and a sha256 pin, checked by
# scripts/guard_fixture_pin.sh. A fixture that grows or changes fails the guard
# instead of being skipped.

jobs:
  # Each guard reports under its own required-check name and is required on its own.
  private-marker-guard:
    # The required check comes from pull_request runs, which scan the PR's merge commit against its merge base.
    # Push runs keep scanning every branch under their own, unrequired name ("(push scan)").
    name: ${{ github.event_name == 'pull_request' && 'private-marker-guard' || 'private-marker-guard (push scan)' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the added-line check below needs the merge base

      - name: self-test — a check that cannot fail is not a check
        run: |
          set -euo pipefail
          # Positive control. Plant one line per marker class and assert the
          # scanner flags them. Without this, a typo in the pattern file turns
          # the real scan below into theatre that always reports "clean".
          cat > /tmp/canary.md <<'CANARY'
          this note is (PRIVATE) to the lane
          for the record; do NOT post
          UNCOMMITTED, private-fork only until reviewed
          code lives on the private fork @ deadbeef
          evidence at ~/e4b-evidence/run1
          radio silence resumes until the gate
          box is a QNAP TVS-h1688X on 10.0.0.68
          must not reach the public remote
          private fork only
          not stamped, not committed
          held for owner review
          moves to the public repo at the gate
          private-lineage
          private-only
          e4b-ssdtier
          grouped-nf4-gemm-private
          experts4bit-qlora-private
          staged for release in ~/e4b-outbox
          latency captures in ~/gnf4-lat
          provider credentials under ~/.runpod/config.toml
          receipt stored at adertha://adertha-agents%23190/receipts/run-1
          aftermath rails
          coordination operation
          do not solicit
          not to be solicited
          intel notes — competitor cadence
          candidate FLEET contribution
          FLEET contributions
          PhxTec
          lab host sits at 192.168.1.24
          feat/pipelined-lean-prefill
          perf/routed-staging-overhead
          integration/lean-onto-routed-staging
          approval at https://cerin-amroth.slack.com/archives/CXXXXXXXXXX/p1700000000000000
          C0BV5028SGM
          moved to pjordanandrsn/adertha-agents
          the launcher refuses unknown keys (adertha-agents#243)
          a stuck load is not machine evidence (adertha#164)
          the failed adertha reconciler
          the receipt sits in adertha-receipts on cdo/state-2026-01-01
          reduced from /Users/someone/runs/x and /home/someone/runs/y
          a venv under /home/n/.venvs/z
          ingested by pjordanandrsn/org-corpus
          the run lock lives at ~/.adertha/rent-live.lock
          # Append-only ledger: one JSON object per line
          {"run_id": "canary-1", "external_receipt": {}}
          {"cost_usd": 0.0, "role": "canary", "date_utc": "2026-01-01", "run_id": "canary-2"}
          CANARY
          grep -vE '^[[:space:]]*(#|$)' .github/private-markers.txt > /tmp/patterns.txt
          np=$(wc -l < /tmp/patterns.txt | tr -d ' ')
          if [ "${np}" -lt 20 ]; then
            echo "::error::pattern file collapsed to ${np} patterns — refusing to run a toothless scan"
            exit 1
          fi
          # EVERY pattern must match at least one canary line. A count of matching
          # LINES cannot do this job: a pattern that matches nothing leaves the
          # count unchanged, so the self-test stays green about a pattern that
          # guards nothing. That is how five patterns shipped unexercised.
          unexercised=0
          while IFS= read -r p; do
            if ! grep -q -E -i -e "$p" /tmp/canary.md; then
              echo "::error::pattern is not exercised by the canary: $p"
              unexercised=$((unexercised + 1))
            fi
          done < /tmp/patterns.txt
          if [ "${unexercised}" -gt 0 ]; then
            echo "::error::${unexercised} of ${np} patterns match no canary line — every pattern needs one"
            exit 1
          fi
          echo "canary exercises all ${np} patterns"
          # "#added-only:" rules (checked on added lines only, below): each must match a canary line too.
          while IFS= read -r rule; do
            p="${rule#\#added-only: }"
            if ! grep -q -E -i -e "$p" /tmp/canary.md; then
              echo "::error::#added-only rule is not exercised by the canary: ${p}"
              exit 1
            fi
          done < <(grep -E '^#added-only: ' .github/private-markers.txt)
          # "#all-of:" rules. Each must match a canary line (the canary row lists
          # its keys in a different order from the store's) and must NOT match a
          # line missing one of its terms, or the --and has decayed into an OR.
          printf '%s\n' '{"run_id": "canary-3", "date_utc": "2026-01-01", "cost_usd": 0.0}' > /tmp/canary-partial.md
          na=0
          while IFS= read -r rule; do
            read -r -a terms <<< "${rule#\#all-of: }"
            args=()
            for t in "${terms[@]}"; do
              [ "${#args[@]}" -eq 0 ] || args+=(--and)
              args+=(-e "$t")
            done
            if ! (cd /tmp && git grep --no-index -q -I -i -E "${args[@]}" -- canary.md); then
              echo "::error::#all-of rule is not exercised by the canary: ${rule}"
              exit 1
            fi
            if (cd /tmp && git grep --no-index -q -I -i -E "${args[@]}" -- canary-partial.md); then
              echo "::error::#all-of rule matched a line missing one of its terms: ${rule}"
              exit 1
            fi
            na=$((na + 1))
          done < <(grep -E '^#all-of: ' .github/private-markers.txt)
          if [ "${na}" -lt 1 ]; then
            echo "::error::no #all-of rules found; the ledger-row rule is gone"
            exit 1
          fi
          # "#exempt-fixture:" pins. Each committed fixture must hold its pin, and
          # the same fixture with one more ledger row appended must not.
          nf=0
          while read -r _ path cap pin; do
            if ! scripts/guard_fixture_pin.sh "$path" "$cap" "$pin" < "$path"; then
              echo "::error::exempt fixture fails its own pin (or is gone): $path"
              exit 1
            fi
            { cat "$path"; echo '{"run_id": "canary-4", "date_utc": "2026-01-01", "role": "canary", "cost_usd": 0.0}'; } > /tmp/mutant
            if scripts/guard_fixture_pin.sh "$path" "$cap" "$pin" < /tmp/mutant 2>/dev/null; then
              echo "::error::a fixture with an added ledger row still passes its pin: $path"
              exit 1
            fi
            nf=$((nf + 1))
          done < <(grep -E '^#exempt-fixture: ' .github/private-markers.txt)
          echo "${na} #all-of rule(s) and ${nf} fixture pin(s) exercised"

      - name: refuse AGENT-* planning docs at any depth
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)AGENT-'; then
            echo "::error::AGENT-* planning docs belong on the private fork"
            exit 1
          fi
          echo "no AGENT-* docs"

      - name: refuse private-lane markers in tracked content
        run: |
          set -euo pipefail
          grep -vE '^[[:space:]]*(#|$)' .github/private-markers.txt > /tmp/patterns.txt
          # A fixture exemption stands only while the fixture holds its pin.
          excl=()
          while read -r _ path cap pin; do
            [ -e "$path" ] || continue
            if ! scripts/guard_fixture_pin.sh "$path" "$cap" "$pin" < "$path"; then
              echo "::error::${path} no longer holds its #exempt-fixture pin"
              exit 1
            fi
            excl+=(":!${path}")
          done < <(grep -E '^#exempt-fixture: ' .github/private-markers.txt)
          hits=$(git grep -n -I -E -i -f /tmp/patterns.txt \
                   -- ':!.github/private-markers.txt' \
                      ':!.github/workflows/private-marker-guard.yml' \
                      ':!bench/dq11/DQ11-AMENDMENT-4.md' ${excl[@]+"${excl[@]}"} \
                 | grep -v 'guard-allow' || true)
          # "#all-of:" rules: every term must match the same line.
          while IFS= read -r rule; do
            read -r -a terms <<< "${rule#\#all-of: }"
            args=()
            for t in "${terms[@]}"; do
              [ "${#args[@]}" -eq 0 ] || args+=(--and)
              args+=(-e "$t")
            done
            more=$(git grep -n -I -E -i "${args[@]}" \
                     -- ':!.github/private-markers.txt' \
                        ':!.github/workflows/private-marker-guard.yml' \
                        ':!bench/dq11/DQ11-AMENDMENT-4.md' ${excl[@]+"${excl[@]}"} \
                   | grep -v 'guard-allow' || true)
            [ -z "${more}" ] || hits="${hits}${hits:+$'\n'}${more}"
          done < <(grep -E '^#all-of: ' .github/private-markers.txt)
          if [ -n "${hits}" ]; then
            echo "::error::private-lane markers found in the public tree:"
            # || true: under pipefail, head closing the pipe early would end the
            # step with SIGPIPE (141) before the guidance below is printed.
            printf '%s\n' "${hits}" | head -40 || true
            echo ""
            echo "Reword it, move it to the private fork, or append 'guard-allow'"
            echo "on the line if the mention is deliberate and safe."
            exit 1
          fi
          echo "clean"

      - name: refuse added-only markers in the lines this change adds
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          grep -E '^#added-only: ' .github/private-markers.txt | sed 's/^#added-only: //' > /tmp/added-only.txt || true
          if [ ! -s /tmp/added-only.txt ]; then echo "no #added-only rules"; exit 0; fi
          base="${PR_BASE:-${PUSH_BEFORE:-}}"
          if [ -z "${base}" ] || [ "${base}" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${base}^{commit}" 2>/dev/null \
             || ! git merge-base --is-ancestor "${base}" HEAD; then
            # a new branch, or a rebase/force-push whose old tip is not an ancestor of HEAD (diffing from it would
            # count lines the default branch gained as this change's own): compare with the default branch instead
            git fetch -q origin "${DEFAULT_BRANCH}"
            base=$(git merge-base HEAD FETCH_HEAD)
          fi
          mb=$(git merge-base "${base}" HEAD)
          hits=$(git diff -U0 --no-color "${mb}" HEAD -- . ':!.github/private-markers.txt' \
                   ':!.github/workflows/private-marker-guard.yml' ':!scripts/hooks/pre-push' \
                 | awk '/^\+\+\+ (b\/|\/dev\/null)/ { f = substr($0, 7); next } /^\+/ { print f ": " substr($0, 2) }' \
                 | grep -v 'guard-allow' | grep -i -E -f /tmp/added-only.txt || true)
          if [ -n "${hits}" ]; then
            echo "::error::this change ADDS a private control-plane reference to the public tree:"
            printf '%s\n' "${hits}" | head -40 || true
            echo ""
            echo "Cite the public PR, file or run id instead, or append 'guard-allow' if the mention is deliberate."
            exit 1
          fi
          echo "clean: no added line carries an #added-only marker (since ${mb:0:12})"
