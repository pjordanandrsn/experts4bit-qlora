name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (CPU torch — GPU loader tests auto-skip on a CPU runner)
        run: |
          # ruff is PINNED: 0.16.0 (2026-07-22..26 window) introduced TRY004 /
          # unused-noqa findings that fail 295 pre-existing sites on untouched
          # code — a floating gate moving under a frozen tree is not a gate.
          # Adopt newer ruff deliberately, with its findings, as its own change.
          python -m pip install --upgrade pip "ruff==0.15.22"
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # grouped-nf4-gemm comes from a pinned git SHA, installed BEFORE
          # .[test] so the extra's version floor (grouped-nf4-gemm>=0.30.0,
          # pyproject [test]) sees it already satisfied and pip never swaps in
          # a different wheel; the floor itself stays a plain range because
          # the published wheel's metadata cannot carry a direct URL. The SHA
          # is the commit of a RELEASE TAG of the kernel package
          # (scripts/check_system_manifest.py asserts it is the tag the
          # manifest's consumer_ci_pin names, or a later release), so the
          # suite exercises the released kernel: d58b39fb… = v0.30.1. Pin a
          # SHA, never a branch name — a deleted branch has broken this
          # install form before — and never a tag name, which can be moved.
          # The int4 tripwire below is why a plain `pip install .[test]` is
          # not enough: tests/test_int4_*.py importorskip on the int4 modules
          # and would report green coverage that never executed (#310).
          pip install "grouped-nf4-gemm @ git+https://github.com/pjordanandrsn/grouped-nf4-gemm.git@d58b39fbb51f15721a32953a4dbd3808a5d1f3a6"
          pip install -e ".[test]"
      - name: int4 modules present (tripwire)
        # The int4 suites guard with importorskip, so a gnf4 build without
        # these modules turns them into green no-ops. Import unguarded here:
        # if the pin above regresses to a pre-int4 build — or a raised floor
        # lets a pre-int4 wheel clobber it — this step fails loudly instead.
        run: python -c "import int4_b32, int4_pack_ref, nf4_grouped, gptq_pack"
      - name: Lint
        run: ruff check experts4bit_qlora tests scripts tools
      - name: Test
        run: pytest tests/ -q

  wheel-smoke:
    # Built-artifact gate (release-repair directive): README's promised surface
    # must equal the wheel's importable surface. scripts/wheel_smoke.py runs
    # from /tmp against a clean-venv wheel install; the link check maps the
    # release tag to main pre-tag (the tag exists only at release time).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: build
        run: |
          python -m pip install --quiet --upgrade pip build
          python -m build
      - name: install wheel into clean venv
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet dist/*.whl \
            torch --extra-index-url https://download.pytorch.org/whl/cpu
      - name: import battery + micros + deprecation check (from the wheel)
        run: |
          cp scripts/wheel_smoke.py /tmp/
          cd /tmp && ./venv/bin/python wheel_smoke.py
      - name: README link check (tag mapped to this tree pre-release)
        # map to the PR head / pushed SHA, not main — a PR that ADDS a
        # README-linked file must validate against its own tree (Bugbot).
        env:
          # ~30 unauthenticated HEADs from a shared Actions IP get throttled: three
          # red runs in one day, once reporting 28 of 28 links dead on a tree where
          # every path existed. The script retries transient answers (never a 404)
          # and authenticates where it can.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          TAG=$(python -c "import tomllib; print('v'+tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          REF="${{ github.event.pull_request.head.sha || github.sha }}"
          python scripts/check_readme_links.py --map-ref "$TAG" "$REF"

  discoverability:
    # CPU-only, deterministic: the machine-readable contracts and the
    # packaging metadata. Nothing here imports the kernels.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: capability contract (schema, pyproject, source symbols, claims, install routes)
        run: python scripts/check_capabilities.py
      - name: claims register hygiene (evidence paths exist at HEAD; measured_on ISO; superseded/retired rows resolve; quoted_in resolves; no pending active row; licence labels name their verdict row)
        run: python scripts/check_claims_register.py
      - name: README = current main (results-table numbers are the register's current values; no superseded/retired id; the release block is generated from CHANGELOG.md) and the position documents cite only ids that exist
        run: python scripts/check_readme_claims.py
      - name: system manifest (floors, ownership and vocabulary vs pyproject, claims, capabilities; every kernel-pinning extra >= the current floor; the CI kernel pin is a release-tag commit at or above the tag consumer_ci_pin names -- the tag list must be readable here, never skipped)
        run: python scripts/check_system_manifest.py --require-tags
      - name: system manifest is byte-identical in the sibling repository at its latest release tag (clone the kernel package at that tag, run --sibling)
        run: |
          set -euo pipefail
          REPO=$(python -c "import json; print(json.load(open('docs/system-manifest.json'))['packages']['kernels']['repository'])")
          TAG=$(git ls-remote --tags "$REPO" 'refs/tags/v*' | sed -n 's#.*refs/tags/\(v[0-9][0-9.]*\)$#\1#p' | sort -t. -k1,1V -k2,2n -k3,3n | tail -1)
          test -n "$TAG"
          echo "sibling $REPO at $TAG"
          git clone --quiet --depth 1 --branch "$TAG" "$REPO" /tmp/sibling
          python scripts/check_system_manifest.py --sibling /tmp/sibling --require-tags
          python scripts/check_claims_register.py --sibling /tmp/sibling
      - name: dependency-floor drift (every current document states pyproject's [fast] floor; historical lines are listed, not failed)
        run: python scripts/check_dependency_floor.py
      - name: change-impact contract (pull requests only -- docs/change-impact.json, what must move together)
        # The base commit is not in a depth-1 checkout; fetch it by sha so the
        # diff is the pull request's own changes. Skipped on push events.
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          python scripts/check_change_impact.py --base "$BASE"
      - name: discovery contract (queries -> solution pages -> concepts, canonical install, limitations; BM25 floor = baseline minus two queries, a local proxy)
        run: python scripts/check_discovery_contract.py --bm25 --bm25-min-top1 30
      - name: llms bundle is current
        run: python scripts/build_llms_bundle.py --check
      - name: solution-page code blocks parse (python) and every local link resolves
        run: python scripts/check_docs_examples.py --root .
      - name: build sdist + wheel, twine check, METADATA assertions
        run: |
          python -m pip install --quiet --upgrade pip build twine
          python -m build
          python -m twine check dist/*
          python scripts/check_wheel_metadata.py dist/*.whl --requires 'grouped-nf4-gemm>=0.30.0; extra == "fast"'
